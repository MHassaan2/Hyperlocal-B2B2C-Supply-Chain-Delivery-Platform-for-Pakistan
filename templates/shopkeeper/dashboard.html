{% extends "base.html" %}

{% block title %}Shopkeeper Dashboard - Hyperlocal Supply Chain{% endblock %}

{% block content %}

<div class="dashboard-container">
    <h2>Shopkeeper Dashboard</h2>
    <p class="welcome-msg">
    Welcome, {{ session["name"] }}!
    </p>

    <div class="dashboard-actions">
        <a href="{{ url_for('shopkeeper_products') }}" class="btn btn-primary">Browse Products</a>
        <a href="{{ url_for('shopkeeper_cart') }}" class="btn btn-secondary">My Cart</a>
        <a href="{{ url_for('shopkeeper_orders') }}" class="btn btn-info">My Orders</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
</div>
{% endblock %}
