{% extends "base.html" %}

{% block title %}Edit Product - Wholesaler{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Edit Product</h2>

    <form method="POST" action="/wholesaler/edit-product/1">

        <div class="form-group">
            <label for="name">Product Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                value= "{{ product.name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea
                id="description"
                name="description"
                required
            >{{ product.description }}</textarea>
        </div>

        <div class="form-group">
            <label for="price">Price (Rs.):</label>
            <input
                type="number"
                id="price"
                name="price"
                value="{{ product.price }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="stock">Stock Quantity:</label>
            <input
                type="number"
                id="stock"
                name="stock"
                value="{{ product.stock }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <input
                type="text"
                id="category"
                name="category"
                value="{{ product.category }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Update Product
        </button>

        <a href="/wholesaler/products" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
